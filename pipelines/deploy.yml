
jobs:
  - job: Deploy
    steps:
      - checkout: self

      - task: CopyFilesOverSSH@0
        inputs:
          sshEndpoint: 'ec2-ssh'
          sourceFolder: '$(Build.SourcesDirectory)'
          contents: |
            src/**
            package.json
            package-lock.json
          targetFolder: '/home/ubuntu/azure-pipeline'

      - task: SSH@0
        inputs:
          sshEndpoint: 'ec2-ssh'
          runOptions: inline
          inline: |
            cd /home/ubuntu/azure-pipeline
            npm ci --omit=dev
            pm2 restart azure-pipeline || pm2 start src/index.js --name azure-pipeline
