
jobs:
  - job: Build
    displayName: Build and Test Node.js Application

    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Install Node.js
        inputs:
          versionSpec: '22.x'

      - script: npm ci
        displayName: Install dependencies

      - script: npm run build
        displayName: Build application

      - script: npm test
        displayName: Run tests

      - task: CopyFiles@2
        displayName: Prepare application files
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'
          Contents: |
            src/**
            package.json
            package-lock.json
          TargetFolder: '$(Build.ArtifactStagingDirectory)/application'

      - task: ArchiveFiles@2
        displayName: Package application
        inputs:
          rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/application'
          includeRootFolder: false
          archiveType: zip
          archiveFile: '$(Build.ArtifactStagingDirectory)/build.zip'
          replaceExistingArchive: true

      - task: PublishBuildArtifacts@1
        displayName: Publish application artifact
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/build.zip'
          ArtifactName: application
          publishLocation: Container
